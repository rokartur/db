[package]
name = "dbtui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
duckdb = { version = "1.20000.0", features = ["bundled"], optional = true }
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
mongodb = { version = "3.9.1", optional = true }
mysql_async = "0.37.1"
native-tls = "0.2.18"
odbc-api = { version = "29.2.0", default-features = false, features = ["odbc_version_3_80", "vendored-unix-odbc"], optional = true }
percent-encoding = "2.3.2"
postgres-native-tls = "0.5.3"
ratatui = "0.30.2"
redis = { version = "1.8.0", features = ["tokio-comp"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rskafka = { version = "0.6.0", optional = true }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rust_decimal = "1.43.0"
scylla = { version = "1.9.0", optional = true, features = ["chrono-04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tokio-postgres = "0.7.18"
tokio-util = { version = "0.7.20", features = ["compat"] }
toml = "1.1.8"
url = "2.5.8"

[features]
default = ["duckdb", "odbc", "mongodb", "cql", "kafka"]
duckdb = ["dep:duckdb"]
odbc = ["dep:odbc-api"]
mongodb = ["dep:mongodb"]
cql = ["dep:scylla"]
kafka = ["dep:rskafka"]
